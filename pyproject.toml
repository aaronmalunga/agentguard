[project]
name = "agentguard"
version = "0.1.0"
description = "Intent verification for AI-agent payments, built on PayPal (sandbox only)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Aaron Malunga" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "paypal-server-sdk>=2.4,<3",
  "google-genai>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "cryptography>=43",
]

[project.scripts]
agentguard-mcp = "agentguard.agent.mcp_server:main"

[project.optional-dependencies]
agent = [
    "mcp>=2.3,<3",
    "strands-agents[gemini]>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.7",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sandbox: calls the real PayPal sandbox (needs keys; skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE"]  # Windows/WSL mounts mark every file executable; git stores them as 100644
