name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is migrating to a new major version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if a secrets file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then echo "Secret file tracked!"; exit 1; fi
      - name: Byte-compile Python
        run: python -m compileall -q spike
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests eval scripts
      - name: Unit tests (fake PayPal, no keys)
        run: uv run pytest --cov=agentguard --cov-report=term
      - name: Attack catalogue rebuilds to the frozen hashes
        run: |
          python eval/attacks/build_catalogue.py && python eval/attacks/build_catalogue_v1.py
          git diff --exit-code eval/attacks
